# Netlify configuration file for your Next.js project.
# This file provides build instructions and settings for your site.
# For more details, see: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Command to build your Next.js site.
  command = "next build"

  # The directory that Netlify will deploy. For Next.js, this is the .next folder.
  publish = ".next"

# Environment variables for the main production site.
# IMPORTANT: For security, it is highly recommended to set these secret values 
# in the Netlify UI under "Site configuration" > "Environment variables" 
# instead of hardcoding them here, especially if your repository is public.
[context.production.environment]
  # NEXT_PUBLIC_SUPABASE_URL = "your-production-supabase-url"
  # NEXT_PUBLIC_SUPABASE_ANON_KEY = "your-production-supabase-anon-key"

# You can also define different settings for deploy previews (e.g., from pull requests).
# [context.deploy-preview.environment]
#   NEXT_PUBLIC_SUPABASE_URL = "your-staging-supabase-url"
#   NEXT_PUBLIC_SUPABASE_ANON_KEY = "your-staging-supabase-anon-key"